name: Discord GitHub activity

on:
  push:
  pull_request:
    types: [opened, reopened, synchronize, closed, review_requested]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issues:
    types: [opened, edited, closed, reopened]
  issue_comment:
    types: [created, edited, deleted]
  discussion:
    types: [created, edited, deleted, transferred, pinned, unpinned, labeled, unlabeled, locked, unlocked, category_changed, answered, unanswered]
  discussion_comment:
    types: [created, edited, deleted]
  create:
  delete:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    uses: ai-project-team3/.github/.github/workflows/discord-notify.yml@main
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
