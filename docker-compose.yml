services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: iceddaeng
      MARIADB_USER: iceddaeng
      MARIADB_PASSWORD: iceddaeng
      MARIADB_ROOT_PASSWORD: iceddaeng_root
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
