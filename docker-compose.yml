services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: eoleumttaeng
      MARIADB_USER: eoleumttaeng
      MARIADB_PASSWORD: eoleumttaeng
      MARIADB_ROOT_PASSWORD: eoleumttaeng_root
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
